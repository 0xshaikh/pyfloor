[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfloor"
version = "0.1.0"
description = "Audit the Python version floor of a project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "pyfloor maintainers" }]
keywords = ["python", "version", "audit", "compatibility", "floor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.scripts]
pyfloor = "pyfloor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
]

[tool.setuptools]
packages = ["pyfloor"]

[tool.setuptools.package-data]
pyfloor = ["py.typed"]

[tool.ruff]
line-length = 100
extend-exclude = ["samples", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "PL", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
